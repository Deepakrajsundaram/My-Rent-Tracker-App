<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0f12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="D's Rent Tracker">
<link rel="manifest" href="./manifest.json?v=1.4">
<link rel="icon" type="image/png" sizes="512x512" href="./ds-rent-tracker-icon-512.png?v=1.4">
<link rel="apple-touch-icon" sizes="180x180" href="./ds-rent-tracker-icon-180.png?v=1.4">
<title>D's Rent Tracker</title>
<style>
:root{--bg:#0d0f12;--card:#171a1f;--card2:#20242b;--text:#f5f7fa;--muted:#9ca3af;--line:#2b3038;--green:#42d392;--amber:#f4b740;--red:#ff6b6b;--accent:#8b7cff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",sans-serif}
body{min-height:100vh}
button,input,select{font:inherit}
button{border:0;color:inherit}
.app{width:min(430px,100%);margin:auto;min-height:100vh;padding:18px 16px 100px}
header{display:flex;align-items:center;justify-content:space-between;margin:4px 0 16px}
.brand-wrap{display:flex;align-items:center;gap:10px;min-width:0}
.brand-logo{width:38px;height:38px;border-radius:11px;object-fit:cover}
.brand{font-weight:800;font-size:21px;letter-spacing:-.5px}
.month{color:var(--muted);font-size:13px;margin-top:2px}
.iconbtn{background:var(--card);width:42px;height:42px;border-radius:14px;font-size:21px;flex:0 0 auto}
.monthnav{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.monthnav button{background:var(--card);border:1px solid var(--line);border-radius:10px;width:34px;height:34px}
.summary{background:linear-gradient(145deg,#1d2027,#15181d);border:1px solid var(--line);border-radius:24px;padding:20px;margin-bottom:18px;box-shadow:0 12px 30px #0004}
.summary .big{font-size:31px;font-weight:800;letter-spacing:-1px}
.summary .label{color:var(--muted);font-size:13px;margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
.stat{background:#ffffff08;border-radius:15px;padding:10px}
.stat b{display:block;font-size:14px}
.stat span{font-size:11px;color:var(--muted)}
.section{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.section h2{font-size:16px;margin:0}
.section button{background:none;color:var(--accent);font-size:13px}
.houses{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.house{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;min-height:132px;position:relative;text-align:left;cursor:pointer}
.house:active{transform:scale(.98)}
.house-top{display:flex;justify-content:space-between;gap:8px}
.house-name{font-weight:750;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tenant{font-size:12px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rent{font-size:18px;font-weight:750;margin-top:18px}
.status{font-size:11px;margin-top:4px;font-weight:700}
.paid{color:var(--green)}.partial{color:var(--amber)}.pending{color:var(--red)}
.quick{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border-radius:11px;background:var(--card2);font-weight:800}
.share{margin-top:14px;width:100%;padding:13px;border-radius:15px;background:#ffffff0a;border:1px solid var(--line);font-weight:700}
.pending-note{margin-top:10px;color:var(--muted);font-size:12px;text-align:center}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(430px,100%);padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#0d0f12ee;backdrop-filter:blur(18px);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid #ffffff10;z-index:30}
nav button{background:none;color:var(--muted);padding:8px;border-radius:12px;font-size:12px}
nav button.active{color:var(--text);background:var(--card)}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:stretch;justify-content:center;z-index:50;overflow:hidden}
.modal.open{display:flex}
.sheet{width:min(430px,100%);height:100%;background:#171a1f;border:1px solid var(--line);border-radius:0;padding:18px 18px calc(105px + env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-header{display:flex;align-items:center;gap:10px;margin-bottom:18px;position:sticky;top:-18px;padding-top:2px;padding-bottom:10px;background:#171a1f;z-index:2}
.sheet-header h2{margin:0;font-size:20px}.sheet-header .sub{margin:3px 0 0}
.sheet h2{margin:0 0 5px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.field{margin:12px 0}
.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
.field input,.field select{width:100%;background:#0f1115;border:1px solid var(--line);border-radius:13px;padding:12px;color:var(--text);outline:none}
.actions{display:flex;gap:8px;margin-top:16px}
.actions button{flex:1;padding:13px;border-radius:14px;background:var(--card2);font-weight:700}
.actions .primary{background:var(--accent);color:white}
.house-edit-block{border-top:1px solid var(--line);padding:12px 0 4px}
.house-edit-title{font-weight:800;margin-bottom:4px}
.history-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.history-card .row{display:flex;justify-content:space-between;gap:10px}
.history-card .small{font-size:12px;color:var(--muted)}
.payment-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin:6px 0}
.empty{color:var(--muted);padding:25px;text-align:center}
@media(max-height:740px){.house{min-height:116px}.rent{margin-top:10px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand-wrap">
    <img class="brand-logo" src="./ds-rent-tracker-icon-180.png?v=1.4" alt="">
    <div><div class="brand">D's Rent Tracker</div><div class="month" id="monthLabel"></div></div>
  </div>
  <button class="iconbtn" onclick="openSettings()" aria-label="Settings">⚙</button>
</header>

<div class="monthnav">
  <button onclick="changeMonth(-1)" aria-label="Previous month">‹</button>
  <div style="flex:1;text-align:center;font-weight:750" id="monthTitle"></div>
  <button onclick="changeMonth(1)" aria-label="Next month">›</button>
</div>

<section class="summary">
  <div class="big" id="collected">₹0</div>
  <div class="label">Collected this month</div>
  <div class="stats">
    <div class="stat"><b id="expected">₹0</b><span>Expected</span></div>
    <div class="stat"><b id="outstanding">₹0</b><span>Outstanding</span></div>
    <div class="stat"><b id="paidCount">0 / 0</b><span>Paid</span></div>
  </div>
  <div class="pending-note" id="lastPending"></div>
  <button class="share" onclick="shareMonth()">↗ Share current month status</button>
</section>

<div class="section"><h2>Your Houses</h2><button onclick="openSettings()">Manage</button></div>
<div class="houses" id="houses"></div>
</div>

<nav>
  <button id="homeNav" class="active" onclick="goHome()">⌂<br>Home</button>
  <button id="historyNav" onclick="openHistory()">◷<br>History</button>
  <button id="settingsNav" onclick="openSettings()">⚙<br>Settings</button>
</nav>

<div class="modal" id="paymentModal" onclick="if(event.target===this)closeModal()">
  <div class="sheet">
    <div class="sheet-header">
      <button class="iconbtn" onclick="closeModal()" aria-label="Back">‹</button>
      <div><h2 id="paymentTitle">Record Payment</h2><div class="sub" id="paymentSub"></div></div>
    </div>
    <div class="field"><label>Payment for month</label><select id="paymentMonth"></select></div>
    <div class="field"><label>Amount received</label><input id="amount" type="number" inputmode="decimal" min="0" placeholder="₹ 0"></div>
    <div class="field"><label>Payment date</label><input id="payDate" type="date"></div>
    <div class="actions"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="savePayment()">Record Payment</button></div>
  </div>
</div>

<div class="modal" id="historyModal" onclick="if(event.target===this)closeHistory()">
  <div class="sheet">
    <div class="sheet-header">
      <button class="iconbtn" onclick="closeHistory()" aria-label="Back to home">‹</button>
      <div><h2>History</h2><div class="sub">Previous months and payment records</div></div>
    </div>
    <div class="monthnav">
      <button onclick="changeHistoryMonth(-1)">‹</button>
      <div style="flex:1;text-align:center;font-weight:750" id="historyMonthTitle"></div>
      <button onclick="changeHistoryMonth(1)">›</button>
    </div>
    <div id="historyContent" style="margin-top:14px"></div>
  </div>
</div>

<div class="modal" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div class="sheet">
    <div class="sheet-header">
      <button class="iconbtn" onclick="closeSettings()" aria-label="Back to home">‹</button>
      <div><h2>House Setup</h2><div class="sub">Edit all 6 houses</div></div>
    </div>
    <div class="sub">Changes are stored locally on this device.</div>
    <div id="settingsFields"></div>
    <div class="actions">
      <button onclick="closeSettings()">Cancel</button>
      <button class="primary" onclick="saveSettings()">Save changes</button>
    </div>
  </div>
</div>

<div class="modal" id="editHouseModal" onclick="if(event.target===this)closeEditHouse()">
  <div class="sheet">
    <div class="sheet-header">
      <button class="iconbtn" onclick="closeEditHouse()" aria-label="Back">‹</button>
      <div><h2>Edit House</h2><div class="sub">Update house details</div></div>
    </div>
    <div class="field"><label>House name</label><input id="editHouseName" type="text"></div>
    <div class="field"><label>Tenant</label><input id="editHouseTenant" type="text"></div>
    <div class="field"><label>Monthly rent</label><input id="editHouseRent" type="number" inputmode="decimal" min="0"></div>
    <div class="actions"><button onclick="closeEditHouse()">Cancel</button><button class="primary" onclick="saveEditedHouse()">Save</button></div>
  </div>
</div>

<script>
const KEY='rentTrackerV1Data';
const today=new Date();
let data=loadData();
let viewDate=new Date(today.getFullYear(),today.getMonth(),1);
let historyDate=new Date(viewDate);
let selectedHouse=null;
let editHouseId=null;

function defaultData(){
  return {
    houses:Array.from({length:6},(_,i)=>({
      id:'h'+(i+1),name:'House '+(i+1),
      tenant:'Tenant '+String.fromCharCode(65+i),
      rent:0,active:true
    })),
    payments:[],version:1
  };
}
function loadData(){
  try{
    const saved=JSON.parse(localStorage.getItem(KEY)||'null');
    if(saved && Array.isArray(saved.houses) && Array.isArray(saved.payments)){
      while(saved.houses.length<6){
        const i=saved.houses.length;
        saved.houses.push({id:'h'+(i+1),name:'House '+(i+1),tenant:'',rent:0,active:true});
      }
      saved.houses=saved.houses.slice(0,6);
      saved.houses.forEach((h,i)=>{h.id=h.id||'h'+(i+1);if(h.active===undefined)h.active=true;h.rent=Number(h.rent)||0});
      saved.version=1;
      return saved;
    }
  }catch(e){}
  return defaultData();
}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function ym(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
function dateFromYM(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo-1,1)}
function previousMonth(m){const d=dateFromYM(m);d.setMonth(d.getMonth()-1);return ym(d)}
function money(n){return new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n)||0)}
function monthName(y,m){return new Intl.DateTimeFormat('en-IN',{month:'long',year:'numeric'}).format(new Date(y,m,1))}
function currentMonth(){return ym(viewDate)}
function monthRecord(h,month=currentMonth()){
  const ps=data.payments.filter(p=>p.houseId===h.id&&p.month===month);
  const paid=ps.reduce((a,p)=>a+Number(p.amount||0),0);
  return {paid,remaining:Math.max(0,Number(h.rent||0)-paid),payments:ps};
}
function outstandingFor(h,month){return monthRecord(h,month).remaining}
function localDateString(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function formatDate(s){return new Intl.DateTimeFormat('en-IN',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(s+'T00:00:00'))}

function render(){
  const m=currentMonth();
  document.getElementById('monthLabel').textContent=monthName(viewDate.getFullYear(),viewDate.getMonth());
  document.getElementById('monthTitle').textContent=monthName(viewDate.getFullYear(),viewDate.getMonth());

  const hs=data.houses.filter(h=>h.active);
  const expected=hs.reduce((a,h)=>a+Number(h.rent||0),0);
  const collected=hs.reduce((a,h)=>a+monthRecord(h,m).paid,0);
  document.getElementById('expected').textContent=money(expected);
  document.getElementById('collected').textContent=money(collected);
  document.getElementById('outstanding').textContent=money(Math.max(0,expected-collected));
  document.getElementById('paidCount').textContent=`${hs.filter(h=>h.rent>0&&monthRecord(h,m).remaining===0).length} / ${hs.length}`;

  const last=previousMonth(m);
  const lastPending=hs.reduce((a,h)=>a+outstandingFor(h,last),0);
  document.getElementById('lastPending').textContent=`Last month pending (${monthName(dateFromYM(last).getFullYear(),dateFromYM(last).getMonth())}): ${money(lastPending)}`;

  const box=document.getElementById('houses');
  box.innerHTML='';
  hs.forEach(h=>{
    const r=monthRecord(h,m);
    const status=h.rent<=0?'SET RENT':r.remaining===0?'PAID':r.paid>0?'PARTIAL':'PENDING';
    const cls=status==='PAID'?'paid':status==='PARTIAL'?'partial':'pending';
    const div=document.createElement('div');
    div.className='house';
    div.onclick=()=>openHouse(h.id);
    div.innerHTML=`
      <div class="house-top">
        <div style="min-width:0">
          <div class="house-name" title="Tap to edit">${esc(h.name)}</div>
          <div class="tenant">${esc(h.tenant)}</div>
        </div>
        <div class="status ${cls}">${status==='PAID'?'✓':status==='PARTIAL'?'◐':'○'}</div>
      </div>
      <div class="rent">${money(h.rent)}</div>
      <div class="status ${cls}">${status==='PARTIAL'?money(r.remaining)+' due':status==='PAID'?'Paid':status==='SET RENT'?'Set rent':'Pending'}</div>
      <button class="quick" onclick="event.stopPropagation();quickPayment('${h.id}')" aria-label="Record payment">${status==='PAID'?'✓':'₹'}</button>
    `;
    box.appendChild(div);
  });
  save();
}
function changeMonth(n){viewDate.setMonth(viewDate.getMonth()+n);render()}
function openHouse(id){
  selectedHouse=id;
  const h=data.houses.find(x=>x.id===id);
  if(!h)return;
  document.getElementById('paymentTitle').textContent=h.name;
  populatePaymentMonths(h,currentMonth());
  document.getElementById('payDate').value=localDateString();
  document.getElementById('paymentModal').classList.add('open');
  updatePaymentForm();
}
function quickPayment(id){
  selectedHouse=id;
  const h=data.houses.find(x=>x.id===id);
  if(!h)return;
  populatePaymentMonths(h,currentMonth());
  document.getElementById('payDate').value=localDateString();
  document.getElementById('paymentTitle').textContent='Full Payment';
  document.getElementById('paymentModal').classList.add('open');
  const r=monthRecord(h,currentMonth());
  document.getElementById('amount').value=r.remaining>0?r.remaining:'';
  updatePaymentForm();
}
function populatePaymentMonths(h,preferred){
  const select=document.getElementById('paymentMonth');
  const current=dateFromYM(currentMonth());
  const opts=[];
  for(let i=6;i>=0;i--){
    const d=new Date(current.getFullYear(),current.getMonth()-i,1);
    const month=ym(d), due=outstandingFor(h,month);
    if(month===currentMonth()||due>0)opts.push({month,due});
  }
  select.innerHTML=opts.map(o=>`<option value="${o.month}" ${o.month===preferred?'selected':''}>${esc(monthName(dateFromYM(o.month).getFullYear(),dateFromYM(o.month).getMonth()))}${o.due>0?' — '+esc(money(o.due))+' due':''}</option>`).join('');
  if(!opts.some(o=>o.month===preferred))select.value=currentMonth();
}
function updatePaymentForm(){
  const h=data.houses.find(x=>x.id===selectedHouse);
  if(!h)return;
  const m=document.getElementById('paymentMonth').value;
  const r=monthRecord(h,m);
  document.getElementById('paymentSub').textContent=`Expected ${money(h.rent)} · Paid ${money(r.paid)} · Remaining ${money(r.remaining)}`;
  const amount=document.getElementById('amount');
  if(!amount.value||Number(amount.value)>r.remaining)amount.value=r.remaining>0?r.remaining:'';
}
document.getElementById('paymentMonth').addEventListener('change',()=>{document.getElementById('amount').value='';updatePaymentForm()});
function closeModal(){document.getElementById('paymentModal').classList.remove('open')}
function savePayment(){
  const amount=Number(document.getElementById('amount').value);
  const date=document.getElementById('payDate').value;
  const month=document.getElementById('paymentMonth').value;
  const h=data.houses.find(x=>x.id===selectedHouse);
  if(!h)return;
  const r=monthRecord(h,month);
  if(!amount||amount<=0||!date||!month)return alert('Enter a valid amount, payment month and date.');
  if(amount>r.remaining)return alert('Amount exceeds the remaining rent for the selected month.');
  data.payments.push({id:(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()),houseId:h.id,month,amount,date});
  save();closeModal();render();
}
function openSettings(){
  const f=document.getElementById('settingsFields');
  f.innerHTML=data.houses.map((h,i)=>`
    <div class="house-edit-block">
      <div class="house-edit-title">House ${i+1}</div>
      <div class="field"><label>House name</label><input data-k="name" data-i="${i}" value="${esc(h.name)}"></div>
      <div class="field"><label>Tenant</label><input data-k="tenant" data-i="${i}" value="${esc(h.tenant)}"></div>
      <div class="field"><label>Monthly rent</label><input data-k="rent" data-i="${i}" type="number" inputmode="decimal" min="0" value="${h.rent||''}"></div>
    </div>`).join('');
  setNav('settings');
  document.getElementById('settingsModal').classList.add('open');
}
function closeSettings(){document.getElementById('settingsModal').classList.remove('open');setNav('home')}
function saveSettings(){
  document.querySelectorAll('#settingsFields input').forEach(x=>{
    const h=data.houses[Number(x.dataset.i)],k=x.dataset.k;
    h[k]=k==='rent'?Number(x.value||0):x.value;
  });
  save();closeSettings();render();
}
function editHouse(id){
  const h=data.houses.find(x=>x.id===id);if(!h)return;
  editHouseId=id;
  document.getElementById('editHouseName').value=h.name||'';
  document.getElementById('editHouseTenant').value=h.tenant||'';
  document.getElementById('editHouseRent').value=h.rent||'';
  document.getElementById('editHouseModal').classList.add('open');
}
function closeEditHouse(){document.getElementById('editHouseModal').classList.remove('open');editHouseId=null}
function saveEditedHouse(){
  const h=data.houses.find(x=>x.id===editHouseId);if(!h)return;
  const name=document.getElementById('editHouseName').value.trim();
  if(!name)return alert('House name cannot be empty.');
  h.name=name;
  h.tenant=document.getElementById('editHouseTenant').value.trim();
  h.rent=Math.max(0,Number(document.getElementById('editHouseRent').value||0));
  save();closeEditHouse();render();
}
function openHistory(){
  historyDate=new Date(viewDate);
  setNav('history');
  renderHistory();
  document.getElementById('historyModal').classList.add('open');
}
function closeHistory(){document.getElementById('historyModal').classList.remove('open');setNav('home')}
function changeHistoryMonth(n){historyDate.setMonth(historyDate.getMonth()+n);renderHistory()}
function renderHistory(){
  const m=ym(historyDate);
  document.getElementById('historyMonthTitle').textContent=monthName(historyDate.getFullYear(),historyDate.getMonth());
  const hs=data.houses.filter(h=>h.active);
  const expected=hs.reduce((a,h)=>a+Number(h.rent||0),0);
  const paid=hs.reduce((a,h)=>a+monthRecord(h,m).paid,0);
  let content=`<div class="summary"><div class="stats" style="margin-top:0"><div class="stat"><b>${money(expected)}</b><span>Expected</span></div><div class="stat"><b>${money(paid)}</b><span>Collected</span></div><div class="stat"><b>${money(Math.max(0,expected-paid))}</b><span>Outstanding</span></div></div></div>`;
  hs.forEach(h=>{
    const r=monthRecord(h,m);
    const status=h.rent<=0?'SET RENT':r.remaining===0?'PAID':r.paid>0?'PARTIAL':'PENDING';
    const cls=status==='PAID'?'paid':status==='PARTIAL'?'partial':'pending';
    content+=`<div class="history-card"><div class="row"><b>${esc(h.name)}</b><b class="${cls}">${status}</b></div><div class="small">${esc(h.tenant)} · Expected ${money(h.rent)}</div><div style="margin-top:9px">Paid: <b>${money(r.paid)}</b> · Remaining: <b>${money(r.remaining)}</b></div>`;
    if(r.payments.length){
      content+=`<div style="border-top:1px solid var(--line);margin-top:9px;padding-top:7px">${r.payments.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`<div class="payment-row"><span>${formatDate(p.date)}</span><b>${money(p.amount)}</b></div>`).join('')}</div>`;
    }else content+=`<div class="small" style="margin-top:8px">No payments recorded</div>`;
    content+=`</div>`;
  });
  document.getElementById('historyContent').innerHTML=content;
}
function shareMonth(){
  const m=currentMonth(), d=dateFromYM(m), hs=data.houses.filter(h=>h.active);
  const lines=hs.map((h,i)=>{
    const r=monthRecord(h,m);
    let status=h.rent<=0?'RENT NOT SET':r.remaining===0?'PAID':r.paid>0?`PARTIAL — ${money(r.remaining)} due`:`PENDING — ${money(r.remaining)} due`;
    const dates=r.payments.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(p=>`${formatDate(p.date)} (${money(p.amount)})`).join(', ');
    return `${i+1}. ${h.name} — ${money(h.rent)} — ${status}${dates?` — ${dates}`:''}`;
  }).join('\\n');
  const expected=hs.reduce((a,h)=>a+Number(h.rent||0),0);
  const paid=hs.reduce((a,h)=>a+monthRecord(h,m).paid,0);
  const text=`D'S RENT TRACKER\nRENT STATUS — ${monthName(d.getFullYear(),d.getMonth())}\n\nExpected: ${money(expected)}\nCollected: ${money(paid)}\nOutstanding: ${money(Math.max(0,expected-paid))}\n\n${lines}`;
  if(navigator.share){navigator.share({title:`Rent Status — ${monthName(d.getFullYear(),d.getMonth())}`,text}).catch(()=>{})}
  else if(navigator.clipboard){navigator.clipboard.writeText(text).then(()=>alert('Status copied to clipboard.'))}
  else alert(text);
}
function setNav(tab){
  document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
  if(tab==='history')document.getElementById('historyNav').classList.add('active');
  else if(tab==='settings')document.getElementById('settingsNav').classList.add('active');
  else document.getElementById('homeNav').classList.add('active');
}
function goHome(){
  closeHistory();closeSettings();closeModal();closeEditHouse();
  setNav('home');
}
render();
</script>
